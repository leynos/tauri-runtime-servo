name: delayed-pr-comment

# Posts one comment after a requested delay by calling the shared reusable
# workflow, which validates the inputs (a whole number of minutes, 0 to 345)
# and passes them to the shell only through the environment.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on'
        required: true
        type: number
      delay_minutes:
        description: 'Minutes to wait before commenting (0 to 345)'
        required: true
        type: number
      message:
        description: 'Comment body'
        required: true
        type: string

jobs:
  delayed-comment:
    permissions:
      pull-requests: write # needed to post comments
    # shared-actions PR 706 merge, 2026-11-24
    uses: leynos/shared-actions/.github/workflows/delayed-pr-comment.yml@bd052c68a4792e92c3272fb1b6ea3b594f3ab7f3
    with:
      pr_number: ${{ inputs.pr_number }}
      delay_minutes: ${{ inputs.delay_minutes }}
      message: ${{ inputs.message }}
